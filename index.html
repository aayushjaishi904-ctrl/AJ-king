बालबालिका परिवार र समाजको भविष्य हुन्। उनीहरूको विकास केवल शारीरिक वृद्धि मात्र होइन। शारीरिक, मानसिक, सामाजिक, भावनात्मक, भाषिक र सिर्जनात्मक पक्षको सन्तुलित विकासलाई सर्वाङ्गीण विकास भनिन्छ।

शारीरिक विकास

बालबालिकाको शारीरिक विकासका लागि पौष्टिक खाना, पर्याप्त निद्रा, स्वच्छ वातावरण र उमेरअनुसारको खेलकुद आवश्यक हुन्छ। दौडने, उफ्रने, चित्र बनाउने र खेलौना मिलाउने जस्ता गतिविधिले शरीरको चाल र समन्वय विकास गर्न सहयोग गर्छ।

मानसिक तथा बौद्धिक विकास

बालबालिकाले प्रश्न सोध्ने, वस्तु अवलोकन गर्ने, कथा सुन्ने र नयाँ कुरा खोज्ने अवसर पाउनुपर्छ। उनीहरूलाई जिज्ञासा व्यक्त गर्न प्रोत्साहन गर्दा सोच्ने र समस्या समाधान गर्ने क्षमता बढ्न सक्छ।

भाषिक विकास

बालबालिकासँग स्पष्ट र मायालु भाषामा कुरा गर्नु, कथा सुनाउनु, गीत गाउनु र उनीहरूलाई आफ्ना विचार व्यक्त गर्न समय दिनु भाषिक विकासका लागि उपयोगी हुन्छ।

खेलको महत्व

खेल बालबालिकाको स्वाभाविक सिकाइको माध्यम हो। खेलबाट उनीहरूले सहकार्य, नियम पालन, कल्पनाशक्ति र आत्मविश्वास विकास गर्न सक्छन्। खेललाई केवल समय बिताउने गतिविधिका रूपमा हेर्नु हुँदैन।

अभिभावक र शिक्षकको भूमिका

बालबालिकालाई सुरक्षित वातावरण, माया, प्रोत्साहन र सिक्ने अवसर दिनु आवश्यक छ। उनीहरूको उमेर र क्षमताअनुसार अपेक्षा राख्नुपर्छ। अरूसँग तुलना गर्नुको सट्टा उनीहरूको आफ्नै प्रगतिलाई प्रोत्साहन गर्नुपर्छ।

निष्कर्ष

बालबालिकाको सर्वाङ्गीण विकासका लागि परिवार, विद्यालय र समुदायको संयुक्त भूमिका आवश्यक हुन्छ। माया, सुरक्षा, पोषण, खेल र गुणस्तरीय शिक्षाले बालबालिकालाई आत्मविश्वासी, जिम्मेवार र सिर्जनशील बन्न सहयोग गर्छ।`

let currentCategory="कथा";

function renderCategories(){
 const box=document.getElementById("categories");
 Object.keys(library).forEach(category=>{
  const btn=document.createElement("button");
  btn.textContent=category;
  btn.onclick=()=>{
   currentCategory=category;
   renderTopics();
  };
  box.appendChild(btn);
 });
}

function renderTopics(){
 const q=document.getElementById("search").value.toLowerCase();
 const box=document.getElementById("topics");
 box.innerHTML="";
 library[currentCategory]
 .filter(item=>item.title.toLowerCase().includes(q))
 .forEach(item=>{
  const btn=document.createElement("button");
  btn.className="topic";
  btn.textContent=item.title;
  btn.onclick=()=>showArticle(item);
  box.appendChild(btn);
 });
}

function showArticle(item){
 const box=document.getElementById("article");
 box.innerHTML="";
 const title=document.createElement("h2");
 title.textContent=item.title;
 box.appendChild(title);

 if(currentCategory==="कथा"){
  item.parts.forEach(part=>{
   const heading=document.createElement("h3");
   heading.textContent=part[0];
   const paragraph=document.createElement("p");
   paragraph.textContent=part[1];
   box.append(heading,paragraph);
  });
 }else{
  const paragraph=document.createElement("p");
  paragraph.textContent=item.text;
  box.appendChild(paragraph);
 }
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

document.getElementById("search").addEventListener("input",renderTopics);
renderCategories();
renderTopics();
</script>
